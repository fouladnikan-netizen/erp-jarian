# Optional local Postgres (if not using Homebrew)
# Usage: docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: jarian-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: jarian
      POSTGRES_PASSWORD: jarian
      POSTGRES_DB: jarian
    volumes:
      - jarian_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jarian -d jarian']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jarian_pg_data:
