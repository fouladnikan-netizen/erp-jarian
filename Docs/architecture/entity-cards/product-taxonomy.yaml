id: product-taxonomy
name: Product Taxonomy (Group -> Category -> Product Type)
tier: B
status: active
ownerModule: shirazeh
aggregateRoot: ProductType
ssot: postgresql
clientState: zustand-cache
lifecycle: "Extensible 3-level taxonomy Group -> Category -> Product Type. Create/rename/reorder/activate/deactivate. Each node has a mnemonic latin sku_code (DDL-24m). Unused empty nodes may be hard-deleted (DDL-24n) so sku_code can be reused; a Group with Categories, a Category with Types, or a Type with Products (including INACTIVE) is blocked with a 409 listing dependents. Inactive in-use nodes stay historically resolvable."
archivePolicy: hard-delete
auditPolicy: append-only
rbacPolicy:
  - products:read
  - products:manage-taxonomy
databaseTable: product_groups, product_categories, product_types
apiBasePath: /api/v1/product-taxonomy
backendRepository: backend/src/repositories/productGroupRepository.js
frontendRepository: src/api/repositories/ProductTaxonomyRepository.js
dependencies:
  - auth-user
integrationPorts:
  - vitrin-product-form
  - kanoon-supplier-capabilities
updatePolicy: SERVER_FIRST
ddlRefs:
  - DDL-24
  - DDL-47
  - DDL-52
  - DDL-53
  - DDL-54
  - DDL-56
  - DDL-57
  - DDL-60
  - DDL-61
migrationSafety: "015_product_master_taxonomy.sql + 039/040/041 latin-name columns + 042 mnemonic sku_code + 047 Type offer defaults (default_count_unit_id, default_sales_unit_id, default_unit_weight, custom_length_allowed) + 050 display_name_rule JSONB (DDL-52), expand-only, IF NOT EXISTS/ON CONFLICT. Group/Category/Type 2-digit taxonomy codes remain allocated but Product SKU uses sku_code (DDL-24m). name_latin on groups/categories/types feeds default sku_code suggestion; sku_code is unique per scope (group global, category per group, type per category). Changing Type offer defaults or display-name rule does not rewrite existing Products. DDL-53 adds optional includeUnit on attribute tokens inside the same JSONB — no new column. DDL-54 adds optional `literal` tokens (`literalId` from a closed catalog) in the same JSONB — no new table."
notes: "DDL-24, DDL-24(b) numeric codes retained, DDL-24(j)–(n), DDL-47, DDL-52, DDL-53, DDL-54, DDL-56. Shirazeh owns taxonomy+schema API; Vitrin owns Product/SKU and the Product Type admin UI under /vitrin/structure (ساختار کالا). sku_code (not the 2-digit code) is the segment used in Product SKU. Group, Category, and Type Latin names feed default sku_code suggestion and remain display labels. DELETE is conditional (DDL-24n). Product Type offer defaults copy onto Product at create. display_name_rule is Type-owned display naming only — never SKU. Unit text in the generated name is resolved from Attribute Definition uomId → UOM registry; includeUnit is a flag only. Display literals (شاخه، برگ، ابعاد، ×، *) are closed catalog ids, not Attribute Definitions and not identity. Mill-sheet Types bind TRANSACTION `sheet_length` and may point the display-name length token at that definition (DDL-56). تسمه فولادی mill width (`strip_width`) is required PRODUCT identity with thickness (DDL-57). DDL-60: live Postgres + git snapshot is the operator catalog, not test data."
