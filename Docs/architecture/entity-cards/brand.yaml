id: brand
name: Brand Registry
tier: B
status: active
ownerModule: shirazeh
aggregateRoot: Brand
ssot: postgresql
clientState: zustand-cache
lifecycle: "Centrally defined Brand (brandName, legalName, normalizedName, active/inactive). Not part of Product SKU identity. Create/deactivate/reactivate; no hard delete since Products may reference a Brand historically."
archivePolicy: soft-delete
auditPolicy: append-only
rbacPolicy:
  - products:read
  - products:manage-brands
databaseTable: brands
apiBasePath: /api/v1/brands
backendRepository: backend/src/repositories/brandRepository.js
frontendRepository: src/api/repositories/BrandRepository.js
dependencies: []
integrationPorts:
  - vitrin-product-brand-reference
updatePolicy: SERVER_FIRST
ddlRefs:
  - DDL-24
migrationSafety: "015_product_master_taxonomy.sql, expand-only. brands.normalized_name has a DB-level UNIQUE constraint (exact-duplicate block, same posture as products.canonical_identity_key, DDL-24d). Probable-duplicate detection (token-overlap similarity, e.g. مبارکه / فولاد مبارکه / فولاد مبارکه اصفهان) warns via 200-with-warning response, never silently blocks; explicit overrideDuplicateWarning flag required to proceed past a probable-duplicate warning, and the override is audited."
notes: "DDL-24(d). Brand duplicate detection reuses the exact same normalize -> exact-block -> probable-warn -> audited-override flow as Product duplicate detection. Brand is NOT part of Product SKU identity — a Product is never duplicated solely due to Brand. Shaped to support a future Nabz Quick-Create-Brand flow (not implemented in this phase)."
